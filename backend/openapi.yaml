  /products:
    get:
      tags:
        - catalog
      summary: 'List products (q, category, brand, condition, minPrice, maxPrice, sort, page, limit)'
      parameters:
        - name: q
          in: query
          required: false
          description: Case-insensitive name search
          schema:
            type: string
            maxLength: 120
        - name: category
          in: path
          required: true
          description: 24-character Mongo ObjectId
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{24}$'
        - name: brand
          in: query
          required: false
          description: Exact brand
          schema:
            type: string
            maxLength: 40
        - name: condition
          in: query
          required: false
          description: Condition grade
          schema:
            type: string
            enum:
