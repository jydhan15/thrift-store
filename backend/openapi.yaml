openapi: 3.0.3
info:
  title: Thrift Store API
  version: 1.0.0
  description: All routes under /api/v1.
servers:
  - url: /api/v1
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Success:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          description: Endpoint-specific payload
        meta:
          type: object
          description: 'Pagination metadata: total, page, limit'
        requestId:
          type: string
          maxLength: 64
      required:
        - success
        - data
    Error:
      type: object
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          type: object
          properties:
            code:
              type: string
              maxLength: 60
            message:
              type: string
              maxLength: 200
            details:
              oneOf:
                - type: object
                - type: 'null'
          required:
            - code
            - message
        requestId:
          type: string
          maxLength: 64
      required:
        - success
        - error
        - requestId
    RegisterRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
        email:
          type: string
          format: email
        password:
          type: string
          maxLength: 100
      required:
        - name
        - email
        - password
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          maxLength: 100
      required:
        - email
        - password
    OfferRequest:
      type: object
      properties:
        amount:
          type: integer
          minimum: 1
      required:
        - amount
    CartAddRequest:
      type: object
      properties:
        productId:
          type: string
          maxLength: 24
        qty:
          type: integer
          minimum: 1
      required:
        - productId
    CheckoutRequest:
      type: object
      properties:
        couponCode:
          type: string
          maxLength: 30
        shippingInfo:
          type: object
          properties:
            fullName:
              type: string
              maxLength: 80
            address:
              type: string
              maxLength: 200
            phone:
              type: string
              maxLength: 20
          required:
            - fullName
            - address
            - phone
      required:
        - shippingInfo
    ProductRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        brand:
          type: string
          maxLength: 40
        description:
          type: string
          maxLength: 2000
        price:
          type: integer
          minimum: 0
        stock:
          type: integer
          minimum: 0
        category:
          type: string
          maxLength: 24
        condition:
          type: string
          enum:
            - like_new
            - good
            - fair
            - worn
        size:
          type: string
          maxLength: 20
        imageUrl:
          type: string
          format: uri
        status:
          type: string
          enum:
            - active
            - inactive
      required:
        - name
        - price
    StockRequest:
      type: object
      properties:
        stock:
          type: integer
          minimum: 0
        reason:
          type: string
          maxLength: 200
      required:
        - stock
        - reason
    StatusRequest:
      type: object
      properties:
        status:
          type: string
          enum:
            - processing
            - shipped
            - delivered
      required:
        - status
    OfferDecisionRequest:
      type: object
      properties:
        decision:
          type: string
          enum:
            - accepted
            - rejected
      required:
        - decision
    CouponRequest:
      type: object
      properties:
        code:
          type: string
          maxLength: 30
        type:
          type: string
          enum:
            - percent
            - fixed
        value:
          type: integer
          minimum: 1
        minSpend:
          type: integer
          minimum: 0
        expiresAt:
          type: string
          format: date-time
        usageLimit:
          type: integer
          minimum: 0
        perUserLimit:
          type: integer
          minimum: 1
      required:
        - code
        - type
        - value
    AIRequest:
      type: object
      properties:
        text:
          type: string
          maxLength: 300
      required:
        - text
    WebhookEvent:
      type: object
      properties:
        eventId:
          type: string
          maxLength: 120
        type:
          type: string
          maxLength: 80
        sessionId:
          type: string
          maxLength: 120
        paymentStatus:
          type: string
          maxLength: 40
      required:
        - eventId
paths:
  /auth/register:
    post:
      tags:
        - auth
      summary: Register
      responses:
        '201':
          description: 'Success — { success:true, data, meta?, requestId }'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Success'
              example:
                success: true
                data:
                  _id: 665f0f2c9d1b4a0012345678
                  status: pending_payment
                meta:
                  total: 1
                  page: 1
                  limit: 10
                requestId: 1f0c2f2a-9b3e-4a7d-8c11-5e2a4b6d0f11
        '401':
          description: Unauthenticated
        '403':
          description: Forbidden
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                error:
                  code: '404'
                  message: Resource not found
                  details: null
                requestId: 1f0c2f2a-9b3e-4a7d-8c11-5e2a4b6d0f11
        '409':
          description: 'Conflict — duplicate, illegal state or stock taken'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                error:
                  code: '409'
                  message: 'Conflict — duplicate, illegal state or stock taken'
                  details: null
                requestId: 1f0c2f2a-9b3e-4a7d-8c11-5e2a4b6d0f11
        '422':
          description: Validation failure with field-level details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                error:
                  code: '422'
                  message: Validation failure with field-level details
                  details: null
                requestId: 1f0c2f2a-9b3e-4a7d-8c11-5e2a4b6d0f11
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                error:
                  code: '429'
                  message: Rate limited
                  details: null
                requestId: 1f0c2f2a-9b3e-4a7d-8c11-5e2a4b6d0f11
        '500':
          description: Unexpected error — generic message plus requestId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                error:
                  code: '500'
                  message: Unexpected error — generic message plus requestId
                  details: null
                requestId: 1f0c2f2a-9b3e-4a7d-8c11-5e2a4b6d0f11
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: Ana
              email: ana@example.com
              password: Password123!
